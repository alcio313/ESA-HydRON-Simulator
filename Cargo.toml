[package]
name = "hydron"
version = "0.1.0"
edition = "2024"

[dependencies]
# default-features off: eframe 0.35 defaults to the wgpu renderer, which is
# noticeably heavier than glow (the 0.27 default this app was tuned for),
# especially on the web where it also bloats the wasm binary.
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "web_screen_reader",
    "x11",
] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

